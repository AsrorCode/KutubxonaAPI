<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — KutubxonaAPI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-base: #0a0a0f;
            --bg-elevated: #14141b;
            --bg-card: rgba(20, 20, 27, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(139, 92, 246, 0.4);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #06b6d4;
            --accent: #ec4899;
            --text: #fafafa;
            --text-dim: #a1a1aa;
            --text-faint: #71717a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--bg-base);
            background-image: radial-gradient(at 20% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%), radial-gradient(at 80% 0%, rgba(6, 182, 212, 0.1) 0px, transparent 50%), radial-gradient(at 50% 100%, rgba(236, 72, 153, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            text-decoration: none;
            padding: 10px 18px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            margin-bottom: 24px;
        }

            .back-btn:hover {
                border-color: var(--border-hover);
                background: rgba(139, 92, 246, 0.1);
            }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            font-size: 32px;
            margin-bottom: 16px;
            box-shadow: 0 12px 40px var(--primary-glow);
        }

        h1 {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff, #c4b5fd 50%, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 15px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            backdrop-filter: blur(20px);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.02em;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

            .form-row.cols-3 {
                grid-template-columns: 1fr 1fr auto;
                align-items: end;
            }

        @media (max-width: 640px) {
            .form-row.cols-3 {
                grid-template-columns: 1fr;
            }
        }

        .form-field label {
            display: block;
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-field input, .form-field textarea, .form-field select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-glass);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

            .form-field input:focus, .form-field textarea:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
            }

        .form-field textarea {
            resize: vertical;
            min-height: 120px;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

            .checkbox-wrap input {
                width: 18px;
                height: 18px;
                accent-color: var(--primary);
            }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            width: 100%;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 8px 30px var(--primary-glow);
            }

            .btn-primary:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }

        .btn-secondary {
            background: var(--bg-glass);
            color: var(--text);
            border: 1px solid var(--border);
        }

            .btn-secondary:hover {
                border-color: var(--border-hover);
                background: rgba(139, 92, 246, 0.08);
            }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

            .btn-danger:hover {
                background: rgba(239, 68, 68, 0.25);
            }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #34d399);
            color: #fff;
        }

        .book-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 16px;
            margin-bottom: 10px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s;
        }

            .book-item:hover {
                border-color: var(--border-hover);
            }

        .book-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .book-info .meta {
            font-size: 12px;
            color: var(--text-dim);
        }

        .book-actions {
            display: flex;
            gap: 8px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .upload-area {
            border: 2px dashed rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            background: rgba(139, 92, 246, 0.03);
        }

            .upload-area:hover {
                border-color: var(--primary);
                background: rgba(139, 92, 246, 0.08);
            }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 999px;
            transition: width 0.3s;
            width: 0%;
        }

        .status-msg {
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 13px;
            display: none;
        }

            .status-msg.success {
                background: rgba(16, 185, 129, 0.1);
                color: var(--success);
                border: 1px solid rgba(16, 185, 129, 0.3);
                display: block;
            }

            .status-msg.error {
                background: rgba(239, 68, 68, 0.1);
                color: var(--danger);
                border: 1px solid rgba(239, 68, 68, 0.3);
                display: block;
            }

            .status-msg.info {
                background: rgba(6, 182, 212, 0.1);
                color: var(--secondary);
                border: 1px solid rgba(6, 182, 212, 0.3);
                display: block;
            }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(20px);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .access-denied {
            text-align: center;
            padding: 60px;
            background: var(--bg-card);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(20px);
        }

            .access-denied h2 {
                color: var(--danger);
                font-size: 28px;
                margin-bottom: 12px;
            }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Kutubxonaga qaytish</a>

        <header>
            <div class="header-icon">⚙️</div>
            <h1>Admin Panel</h1>
            <p class="subtitle">Kitoblarni boshqarish, sahifalar yuklash va o'chirish</p>
        </header>

        <div id="content" style="display:none;">
            <!-- STATISTIKA -->
            <div class="stats-grid" id="statsGrid"></div>

            <!-- YANGI KITOB -->
            <div class="card">
                <div class="card-title">📕 Yangi kitob qo'shish</div>
                <div class="form-row cols-3">
                    <div class="form-field">
                        <label>Kitob nomi *</label>
                        <input type="text" id="newTitle" placeholder="Masalan: O'tkan kunlar">
                    </div>
                    <div class="form-field">
                        <label>Muallif *</label>
                        <input type="text" id="newAuthor" placeholder="Abdulla Qodiriy">
                    </div>
                    <div class="checkbox-wrap">
                        <input type="checkbox" id="newAvailable" checked>
                        <label for="newAvailable" style="margin:0;">Mavjud</label>
                    </div>
                </div>
                <div class="form-row cols-3">
                    <div class="form-field">
                        <label>Nashr yili</label>
                        <input type="number" id="newYear" placeholder="1925" min="1000" max="2100">
                    </div>
                    <div class="form-field">
                        <label>Kategoriya</label>
                        <input type="text" id="newCategory" placeholder="Klassika">
                    </div>
                    <button class="btn btn-primary" onclick="createBook()">+ Yaratish</button>
                </div>
                <div class="status-msg" id="createStatus"></div>
            </div>

            <!-- PDF YUKLASH -->
            <div class="card">
                <div class="card-title">📄 PDF dan sahifalar yuklash</div>
                <div class="form-field">
                    <label>Kitobni tanlang</label>
                    <select id="pdfBookSelect">
                        <option value="">-- Kitob tanlang --</option>
                    </select>
                </div>
                <label class="upload-area" for="pdfInput">
                    <div class="upload-icon">📁</div>
                    <div style="font-weight:600; margin-bottom:4px;">PDF faylni tanlang</div>
                    <div style="color:var(--text-dim); font-size:13px;">Matn avtomatik ajratiladi va sahifalarga bo'linadi</div>
                    <input type="file" id="pdfInput" accept=".pdf" style="display:none;" onchange="handlePdfSelected(event)">
                </label>
                <div class="progress-bar" id="pdfProgress" style="display:none;">
                    <div class="progress-fill" id="pdfFill"></div>
                </div>
                <div class="status-msg" id="pdfStatus"></div>
            </div>

            <!-- KITOBLAR RO'YXATI -->
            <div class="card">
                <div class="card-title">📚 Barcha kitoblar</div>
                <div id="booksList"></div>
            </div>
        </div>

        <!-- ACCESS DENIED -->
        <div id="accessDenied" class="access-denied" style="display:none;">
            <h2>🚫 Ruxsat yo'q</h2>
            <p style="color:var(--text-dim); margin-bottom:20px;">Bu sahifa faqat administratorlar uchun</p>
            <a href="/" class="btn btn-secondary" style="text-decoration:none;">← Bosh sahifaga qaytish</a>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        function getToken() { return localStorage.getItem('auth_token'); }
        function getUser() {
            const s = localStorage.getItem('auth_user');
            return s ? JSON.parse(s) : null;
        }
        function authHeaders(json = true) {
            const h = { 'Authorization': `Bearer ${getToken()}` };
            if (json) h['Content-Type'] = 'application/json';
            return h;
        }

        function checkAdmin() {
            const user = getUser();
            if (!user || user.role !== 'Admin') {
                document.getElementById('accessDenied').style.display = 'block';
                return false;
            }
            document.getElementById('content').style.display = 'block';
            return true;
        }

        // ========== KITOBLAR ==========
        async function loadBooks() {
            try {
                const res = await fetch(`${API}/books?pageSize=100`);
                const data = await res.json();
                const books = data.items || data;

                // Statistika
                const stats = document.getElementById('statsGrid');
                stats.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-value">${books.length}</div>
                            <div class="stat-label">📚 Jami kitoblar</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${books.filter(b => b.isAvailable).length}</div>
                            <div class="stat-label">✅ Mavjud</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${new Set(books.map(b => b.category)).size}</div>
                            <div class="stat-label">🏷️ Kategoriyalar</div>
                        </div>
                    `;

                // PDF select
                const select = document.getElementById('pdfBookSelect');
                select.innerHTML = '<option value="">-- Kitob tanlang --</option>' +
                    books.map(b => `<option value="${b.id}">${b.title} — ${b.author}</option>`).join('');

                // Kitoblar ro'yxati
                const list = document.getElementById('booksList');
                if (books.length === 0) {
                    list.innerHTML = '<p style="color:var(--text-dim); text-align:center; padding:20px;">Hali kitoblar yo\'q</p>';
                    return;
                }
                list.innerHTML = books.map(b => `
                        <div class="book-item">
                            <div class="book-info">
                                <h3>${b.title}</h3>
                                <div class="meta">
                                    ✍️ ${b.author} • 📅 ${b.year} •
                                    <span class="badge">${b.category}</span>
                                    ${b.isAvailable ? '<span class="badge" style="color:var(--success);">Mavjud</span>' : '<span class="badge" style="color:var(--danger);">Yo\'q</span>'}
                                </div>
                            </div>
                            <div class="book-actions">
                                <button class="btn btn-danger" onclick="deleteBook(${b.id}, '${b.title.replace(/'/g, "\\'")}')">🗑️ O'chirish</button>
                            </div>
                        </div>
                    `).join('');
            } catch (err) {
                console.error('Xato:', err);
            }
        }

        async function createBook() {
            const title = document.getElementById('newTitle').value.trim();
            const author = document.getElementById('newAuthor').value.trim();
            const year = parseInt(document.getElementById('newYear').value) || new Date().getFullYear();
            const category = document.getElementById('newCategory').value.trim() || 'Boshqa';
            const isAvailable = document.getElementById('newAvailable').checked;
            const status = document.getElementById('createStatus');

            if (!title || !author) {
                status.className = 'status-msg error';
                status.textContent = '❌ Kitob nomi va muallif majburiy';
                return;
            }

            try {
                const res = await fetch(`${API}/books`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ title, author, year, category, isAvailable })
                });
                if (!res.ok) throw new Error(`Xato: ${res.status}`);
                status.className = 'status-msg success';
                status.textContent = '✅ Kitob yaratildi!';
                document.getElementById('newTitle').value = '';
                document.getElementById('newAuthor').value = '';
                document.getElementById('newCategory').value = '';
                await loadBooks();
                setTimeout(() => status.className = 'status-msg', 3000);
            } catch (err) {
                status.className = 'status-msg error';
                status.textContent = '❌ ' + err.message;
            }
        }

        async function deleteBook(id, title) {
            if (!confirm(`"${title}" kitobini o'chirmoqchimisiz?`)) return;
            try {
                const res = await fetch(`${API}/books/${id}`, {
                    method: 'DELETE',
                    headers: authHeaders(false)
                });
                if (!res.ok) throw new Error(`Xato: ${res.status}`);
                await loadBooks();
            } catch (err) { alert('Xato: ' + err.message); }
        }

        // ========== PDF UPLOAD ==========
        async function handlePdfSelected(event) {
            const file = event.target.files[0];
            const bookId = document.getElementById('pdfBookSelect').value;
            const status = document.getElementById('pdfStatus');
            const progress = document.getElementById('pdfProgress');
            const fill = document.getElementById('pdfFill');

            if (!bookId) {
                status.className = 'status-msg error';
                status.textContent = '❌ Avval kitobni tanlang';
                return;
            }
            if (!file) return;

            status.className = 'status-msg info';
            status.textContent = '📖 PDF o\'qilmoqda...';
            progress.style.display = 'block';
            fill.style.width = '10%';

            try {
                const reader = new FileReader();
                reader.onload = async () => {
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(reader.result)).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        fullText += content.items.map(it => it.str).join(' ') + '\n\n';
                        fill.style.width = (10 + (i / pdf.numPages) * 70) + '%';
                    }

                    status.textContent = '💾 Serverga yuborilmoqda...';
                    const res = await fetch(`${API}/books/${bookId}/pages/bulk`, {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify({ fullText })
                    });
                    if (!res.ok) throw new Error('Server xatosi');
                    const data = await res.json();
                    fill.style.width = '100%';
                    status.className = 'status-msg success';
                    status.textContent = `✅ ${data.count || 'Sahifalar'} muvaffaqiyatli yuklandi!`;
                    document.getElementById('pdfInput').value = '';
                    setTimeout(() => {
                        progress.style.display = 'none';
                        status.className = 'status-msg';
                    }, 3000);
                };
                reader.readAsArrayBuffer(file);
            } catch (err) {
                status.className = 'status-msg error';
                status.textContent = '❌ ' + err.message;
                progress.style.display = 'none';
            }
        }

        // ========== INIT ==========
        if (checkAdmin()) {
            loadBooks();
        }
    </script>
</body>
</html>
