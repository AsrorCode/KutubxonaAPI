<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — Kutubxona</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0f;
            --bg-elevated: #14141b;
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(139, 92, 246, 0.4);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #06b6d4;
            --accent: #ec4899;
            --text: #fafafa;
            --text-dim: #a1a1aa;
            --text-faint: #71717a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: var(--bg-base);
            background-image:
                radial-gradient(at 20% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 0%, rgba(6, 182, 212, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(236, 72, 153, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-dim); text-decoration: none;
            font-size: 14px; margin-bottom: 24px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--primary); }

        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-header .icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 14px; font-size: 28px; margin-bottom: 16px;
            box-shadow: 0 8px 32px var(--primary-glow);
        }
        .auth-header h1 {
            font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #c4b5fd 50%, #67e8f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .auth-header .subtitle { color: var(--text-dim); font-size: 14px; }

        .form-field { margin-bottom: 16px; }
        .form-field label {
            display: block; color: var(--text-dim); font-size: 13px;
            margin-bottom: 6px; font-weight: 500;
        }
        .form-field input {
            width: 100%; padding: 12px 14px;
            background: var(--bg-glass); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 14px; font-family: inherit; outline: none;
            transition: all 0.2s;
        }
        .form-field input::placeholder { color: var(--text-faint); }
        .form-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; border: none; padding: 14px;
            border-radius: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; width: 100%; margin-top: 8px;
            font-family: inherit;
            box-shadow: 0 8px 24px var(--primary-glow);
            transition: all 0.2s;
        }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px var(--primary-glow);
        }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .auth-footer {
            text-align: center; margin-top: 24px;
            color: var(--text-dim); font-size: 14px;
        }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }

        .status {
            padding: 12px 14px; border-radius: 10px;
            margin-top: 14px; font-size: 13px; display: none;
        }
        .status.success {
            background: rgba(16, 185, 129, 0.1); color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3); display: block;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.1); color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3); display: block;
        }
        .status.warning {
            background: rgba(245, 158, 11, 0.1); color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3); display: block;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <a href="/" class="back-link">← Kutubxonaga qaytish</a>

        <div class="auth-header">
            <div class="icon">🔐</div>
            <h1>Kirish</h1>
            <p class="subtitle">Hisobingizga kiring</p>
        </div>

        <form id="loginForm" onsubmit="return submitLogin(event)">
            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="email@example.com" autocomplete="email">
            </div>

            <div class="form-field">
                <label for="password">Parol</label>
                <input type="password" id="password" required placeholder="Parolingiz" autocomplete="current-password">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Kirish</button>
            <div id="status" class="status"></div>
        </form>

        <div class="auth-footer">
            Hisobingiz yo'qmi? <a href="/register.html">Ro'yxatdan o'ting</a>
        </div>
    </div>

    <script>
        async function submitLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = 'Tekshirilmoqda...';
            statusEl.className = 'status';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.status === 429) {
                    throw new Error('⏱️ Juda ko\'p urinish. 1 daqiqa kutib qayta uring.');
                }

                if (response.status >= 500) {
                    throw new Error('🔧 Server xatosi. Iltimos, keyinroq urinib ko\'ring.');
                }

                const text = await response.text();
                let data;
                try {
                    data = text ? JSON.parse(text) : {};
                } catch {
                    throw new Error('Serverdan noto\'g\'ri javob keldi');
                }

                if (!response.ok) {
                    throw new Error(data.message || 'Email yoki parol noto\'g\'ri');
                }

                // Access + Refresh token saqlash
                localStorage.setItem('auth_token', data.accessToken || data.token);
                if (data.refreshToken) {
                    localStorage.setItem('auth_refresh_token', data.refreshToken);
                }
                localStorage.setItem('auth_user', JSON.stringify(data.user));

                statusEl.textContent = `👋 Xush kelibsiz, ${data.user.firstName}!`;
                statusEl.className = 'status success';

                setTimeout(() => { window.location.href = '/'; }, 1000);
            } catch (error) {
                statusEl.textContent = error.message;
                statusEl.className = 'status error';
                btn.disabled = false;
                btn.textContent = 'Kirish';
            }
            return false;
        }

        if (localStorage.getItem('auth_token')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
