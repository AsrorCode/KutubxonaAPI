<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — Kutubxona</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2c1810 0%, #5d3a1e 100%);
            color: #f4ebd9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: rgba(0,0,0,0.4);
            border: 2px solid #8b4513;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

            .auth-header h1 {
                font-size: 30px;
                background: linear-gradient(45deg, #ffd700, #ff8c00);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 8px;
            }

            .auth-header .icon {
                font-size: 50px;
                margin-bottom: 10px;
            }

            .auth-header .subtitle {
                color: #c8b89c;
                font-size: 14px;
            }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-field {
            margin-bottom: 18px;
        }

            .form-field label {
                display: block;
                color: #ffd700;
                font-weight: 600;
                margin-bottom: 6px;
                font-size: 14px;
            }

            .form-field input {
                width: 100%;
                padding: 12px 16px;
                background: #faf3e0;
                color: #2c1810;
                border: 2px solid #8b4513;
                border-radius: 8px;
                font-size: 15px;
                outline: none;
                transition: all 0.3s;
            }

                .form-field input:focus {
                    border-color: #ffd700;
                }

        .submit-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
        }

            .submit-btn:hover:not(:disabled) {
                transform: translateY(-2px);
            }

            .submit-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #c8b89c;
            font-size: 14px;
        }

            .auth-footer a {
                color: #ffd700;
                text-decoration: none;
                font-weight: 600;
            }

                .auth-footer a:hover {
                    text-decoration: underline;
                }

        .status {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

            .status.success {
                background: rgba(16,185,129,0.2);
                border: 1px solid #10b981;
                color: #6ee7b7;
                display: block;
            }

            .status.error {
                background: rgba(239,68,68,0.2);
                border: 1px solid #ef4444;
                color: #fca5a5;
                display: block;
            }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffd700;
            text-decoration: none;
            font-size: 14px;
        }

            .back-link:hover {
                text-decoration: underline;
            }

        .hint {
            color: #8b7355;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <a href="/" class="back-link">← Kutubxonaga qaytish</a>

        <div class="auth-header">
            <div class="icon">✏️</div>
            <h1>Ro'yxatdan o'tish</h1>
            <p class="subtitle">Yangi hisob yarating</p>
        </div>

        <form id="registerForm" onsubmit="return submitRegister(event)">
            <div class="form-row">
                <div class="form-field">
                    <label for="firstName">Ism</label>
                    <input type="text" id="firstName" required placeholder="Asror" autocomplete="given-name">
                </div>
                <div class="form-field">
                    <label for="lastName">Familiya</label>
                    <input type="text" id="lastName" required placeholder="Haydarov" autocomplete="family-name">
                </div>
            </div>

            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="email@example.com" autocomplete="email">
            </div>

            <div class="form-field">
                <label for="password">Parol</label>
                <input type="password" id="password" required minlength="6" placeholder="Kamida 6 ta belgi" autocomplete="new-password">
                <div class="hint">Parolni esda saqlang — keyinroq kirish uchun kerak</div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Ro'yxatdan o'tish</button>
            <div id="status" class="status"></div>
        </form>

        <div class="auth-footer">
            Hisobingiz bormi? <a href="/login.html">Tizimga kiring</a>
        </div>
    </div>

    <script>
        async function submitRegister(e) {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = 'Yaratilmoqda...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ firstName, lastName, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    let errorMsg = data.message || 'Ro\'yxatdan o\'tish xato';
                    if (data.errors) {
                        const allErrors = Object.values(data.errors).flat().join('; ');
                        if (allErrors) errorMsg = allErrors;
                    }
                    throw new Error(errorMsg);
                }

                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('auth_user', JSON.stringify(data.user));

                statusEl.textContent = `🎉 Tabriklaymiz, ${data.user.firstName}! Hisobingiz yaratildi.`;
                statusEl.className = 'status success';

                setTimeout(() => { window.location.href = '/'; }, 1500);
            } catch (error) {
                statusEl.textContent = error.message;
                statusEl.className = 'status error';
                btn.disabled = false;
                btn.textContent = 'Ro\'yxatdan o\'tish';
            }
            return false;
        }

        if (localStorage.getItem('auth_token')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
