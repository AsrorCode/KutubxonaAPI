<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi parol — Kutubxona</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-base); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px;
            padding: 32px; max-width: 400px; width: 100%; box-shadow: 0 8px 30px rgba(15,23,42,.06); }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p.sub { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; background: var(--bg-base); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; margin-bottom: 16px; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: none;
            border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
        button:hover { background: #8a3f07; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .msg { font-size: 13px; margin-top: 14px; }
        .msg.ok { color: var(--success); }
        .msg.err { color: var(--danger); }
        .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--primary); text-decoration: none; }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <script src="/ui.js"></script>
</head>
<body>
    <div class="card">
        <h1>Yangi parol o'rnatish</h1>
        <p class="sub">Yangi parolingizni kiriting.</p>
        <label>Yangi parol</label>
        <input type="password" id="pass" placeholder="Kamida 6 belgi">
        <label>Parolni takrorlang</label>
        <input type="password" id="pass2" placeholder="Qayta kiriting">
        <button id="btn" onclick="submitReset()">Parolni yangilash</button>
        <div class="msg" id="msg"></div>
        <a href="/login.html" class="back">← Kirishga qaytish</a>
    </div>
    <script>
        const token = new URLSearchParams(location.search).get('token') || '';
        if (!token) {
            document.getElementById('msg').className = 'msg err';
            document.getElementById('msg').textContent = 'Havola noto\'g\'ri (token yo\'q).';
        }
        async function submitReset() {
            const p1 = document.getElementById('pass').value;
            const p2 = document.getElementById('pass2').value;
            const msg = document.getElementById('msg');
            if (p1.length < 6) { msg.className = 'msg err'; msg.textContent = 'Parol kamida 6 belgi'; return; }
            if (p1 !== p2) { msg.className = 'msg err'; msg.textContent = 'Parollar mos emas'; return; }
            const btn = document.getElementById('btn'); btn.disabled = true;
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: p1 })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Xato');
                msg.className = 'msg ok'; msg.textContent = '✅ ' + (data.message || 'Parol yangilandi');
                setTimeout(() => location.href = '/login.html', 1500);
            } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
            finally { btn.disabled = false; }
        }
    </script>
</body>
</html>
